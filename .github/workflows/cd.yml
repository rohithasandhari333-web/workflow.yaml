name: CD (nodejs-demo)

on:
  workflow_run:
    workflows: ["CI (nodejs-demo)"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nodejs-demo 

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: nodejs-demo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    needs: build-push

    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
      IMAGE: ghcr.io/${{ github.repository }}/nodejs-demo:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Skip Deployment if Kubeconfig Missing
        if: env.KUBECONFIG_DATA == ''
        run: |
          echo "KUBECONFIG_DATA secret is missing."
          echo "Docker image was pushed successfully."
          echo "Add KUBECONFIG_DATA secret to enable Kubernetes deployment."

      - name: Configure kubectl
        if: env.KUBECONFIG_DATA != ''
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy to Kubernetes (Rolling Update)
        if: env.KUBECONFIG_DATA != ''
        run: |
          NS="${{ vars.K8S_NAMESPACE || 'default' }}"
          kubectl set image deployment/nodejs-demo nodejs-demo="$IMAGE" -n "$NS"
          kubectl rollout status deployment/nodejs-demo -n "$NS"

      - name: Smoke Test
        if: env.KUBECONFIG_DATA != ''
        run: |
          echo "Deployment completed successfully."
          echo "Run: curl -f https://<your-app-url>/health"
